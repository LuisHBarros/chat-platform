name: CI / Auth Service Quality & Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  auth-service-ci:
    name: Auth Service Quality Checks & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v5.4.2
        with:
          enable-cache: true
          version: "0.8.12" # Pin to a specific version

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: ./auth-service
        run: uv sync --frozen --no-build

      - name: Run Ruff Linter
        working-directory: ./auth-service
        run: uv run --no-build --frozen ruff check .

      - name: Run Ruff Formatter Check
        working-directory: ./auth-service
        run: uv run --no-build --frozen ruff format --check .

      - name: Run Mypy Type Checker
        working-directory: ./auth-service
        run: uv run --no-build --frozen mypy app test

      - name: Run Pytest Unit Tests
        working-directory: ./auth-service
        run: uv run --no-build --frozen python -m pytest test/domain -v
