[project]
name = "auth-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "luishbarros", email = "luishrbr@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "pyjwt>=2.13.0",
    "redis>=5.2.1",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
auth-service = "auth_service:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false


[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = "."
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"



