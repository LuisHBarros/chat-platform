server {
    listen 80;
    server_name localhost;

    # Client body limit
    client_max_body_size 10M;

    # Frontend Static Site
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy to Auth Service APIs
    location /api/ {
        proxy_pass http://auth-service:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health Check Proxy Endpoint
    location /health {
        proxy_pass http://auth-service:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API Documentation Proxy
    location /docs {
        proxy_pass http://auth-service:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://auth-service:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
